[package]
name = "seed-midi"
version = "0.1.0"
edition = "2024"

[dependencies]
midly = "0.5.3"
walkdir = "2.5.0"
serde_json = "1"
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures = "0.3.34"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }